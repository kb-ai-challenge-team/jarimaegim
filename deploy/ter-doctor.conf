server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jarimaegim.duckdns.org 13.125.18.54;
    return 301 https://jarimaegim.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jarimaegim.duckdns.org;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/jarimaegim.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarimaegim.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
