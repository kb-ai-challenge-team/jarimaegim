server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jarimaegim.duckdns.org 13.125.18.54;
    return 301 https://jarimaegim.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jarimaegim.duckdns.org;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/jarimaegim.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarimaegim.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSE chat stream (POST /api/v1/cases/{case_id}/messages/stream). Must be matched here,
    # above the general /api/v1/ prefix location below: nginx evaluates regex ("~") locations
    # in the order they appear in the file and stops at the first match, only falling back to
    # the longest-matching prefix location ("/api/v1/") if no regex matches -- so this block's
    # position, not just its content, is what makes it take effect. case_id is a UUID
    # (FastAPI's path param is typed `UUID`), so the pattern is anchored to that shape rather
    # than a bare [^/]+: a request that doesn't match (malformed id) falls through to the
    # buffered /api/v1/ block below, but that is harmless because such a request was never a
    # legitimate long-lived stream -- the backend rejects it immediately (422/404), not slowly.
    location ~* ^/api/v1/cases/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/messages/stream$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # nginx's own default Connection header toward the upstream is "close"; clearing it
        # here (paired with proxy_http_version 1.1 above) is the standard idiom to stop nginx
        # from forcing connection-close semantics on what must stay a persistent, chunked
        # streaming response.
        proxy_set_header Connection "";
        # The backend already sends `X-Accel-Buffering: no`, which nginx honors per-response,
        # so these two are functionally redundant with it today. Kept explicit anyway so this
        # location's no-buffering intent doesn't silently depend on that one backend response
        # header never being dropped, stripped by an intermediary, or overridden by a future
        # `proxy_ignore_headers` elsewhere. No proxy_cache zone is defined anywhere in this
        # deployment, so `proxy_cache off` is a defensive no-op today, not a fix for a live bug.
        proxy_buffering off;
        proxy_cache off;
        # 8x the backend's 15s heartbeat (`: ping` comment frames, see heartbeat_frames() in
        # backend/app/main.py). proxy_read_timeout resets on every byte received from upstream,
        # so a healthy turn -- pinged at least every 15s even across a 20s MCP subprocess
        # startup or four rounds of 8s tool calls -- never approaches this value. 120s also
        # matches the timeout already used below for /api/v1/, giving enough margin to absorb
        # scheduling jitter under load without turning this into a timeout that never fires.
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
